name: jobhunt

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobhunt
      POSTGRES_PASSWORD: jobhunt
      POSTGRES_DB: jobhunt
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - ./.pgdata-app:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunt -d jobhunt"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jobhunt:jobhunt@postgres:5432/jobhunt?sslmode=disable
      VAULT_BANK_PATH: /tmp/jobhunt-bank
    ports:
      - "127.0.0.1:8765:8765"

  fit-worker:
    build:
      context: .
      args:
        FIT_EXTRA: fit
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://jobhunt:jobhunt@postgres:5432/jobhunt?sslmode=disable
      HF_HOME: /models
      FIT_MODEL: bge
    volumes:
      - ./.models:/models:ro
    command: ["jobhunt", "fit", "worker"]
    stop_grace_period: 60s
    restart: unless-stopped

  ui:
    build:
      context: ./web
      args:
        JOBHUNT_API_URL: http://web:8765
    depends_on:
      - web
    environment:
      JOBHUNT_API_URL: http://web:8765
    ports:
      - "127.0.0.1:3000:3000"

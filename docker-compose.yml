name: jobhunt

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobhunt
      POSTGRES_PASSWORD: jobhunt
      POSTGRES_DB: jobhunt
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - ./.pgdata-app:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunt -d jobhunt"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jobhunt:jobhunt@postgres:5432/jobhunt?sslmode=disable
      VAULT_BANK_PATH: /tmp/jobhunt-bank
    ports:
      - "127.0.0.1:8765:8765"

  fit-worker:
    build:
      context: ./api
      args:
        FIT_EXTRA: fit
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://jobhunt:jobhunt@postgres:5432/jobhunt?sslmode=disable
      VAULT_BANK_PATH: /tmp/jobhunt-bank
      HF_HOME: /models
    volumes:
      - ./.models:/models:ro
    command: ["jobhunt", "fit", "worker"]
    stop_grace_period: 60s
    restart: unless-stopped

  resume-worker:
    build:
      context: ./api
      args:
        FIT_EXTRA: fit,resume
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jobhunt:jobhunt@postgres:5432/jobhunt?sslmode=disable
      HF_HOME: /models
      JOBHUNT_ALLOW_OFFSITE: "1"
      RESUME_MODEL: claude-opus-5-5
      RESUME_GATE: warn
      RESUME_MAX_COST_USD: "20"
      RESUME_KIT_DIR: /kit
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./.models:/models:ro
      - ./api/resume-kit:/kit:ro
    command: ["jobhunt", "resume", "worker"]
    stop_grace_period: 30s

  ui:
    build:
      context: ./app
      args:
        JOBHUNT_API_URL: http://api:8765
    depends_on:
      - api
    environment:
      JOBHUNT_API_URL: http://api:8765
    ports:
      - "127.0.0.1:3000:3000"

{% extends "base.html" %}
{% block content %}
<main class="shell">
  <form
    id="filters"
    class="search"
    method="get"
    action="/jobs"
    hx-get="/jobs"
    hx-trigger="submit, change, keyup changed delay:300ms from:#q, keyup changed delay:300ms from:#where"
    hx-target="#results"
    hx-push-url="true"
    hx-indicator="#spinner"
  >
    <div class="search-bar">
      <div class="field">
        <label for="q">What</label>
        <input id="q" name="q" type="search" placeholder="Job title, keywords" value="{{ filters.q or '' }}" />
      </div>
      <div class="field">
        <label for="where">Where</label>
        <input id="where" name="where" type="text" placeholder="City or country" value="{{ filters.where or '' }}" />
      </div>
      <button class="btn-primary" type="submit">Find jobs</button>
    </div>
    <div class="chips">
      <div>
        <label class="chip-label" for="remote">Remote</label>
        <select id="remote" name="remote">
          <option value="">Any</option>
          {% for value, label in [('remote', 'Remote'), ('hybrid', 'Hybrid'), ('onsite', 'On-site')] %}
          <option value="{{ value }}" {% if filters.remote == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="chip-label" for="posted_within">Date posted</label>
        <select id="posted_within" name="posted_within">
          <option value="">Any time</option>
          {% for days in [1, 3, 7, 14] %}
          <option value="{{ days }}" {% if filters.posted_within == days %}selected{% endif %}>Last {{ days }} days</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="chip-label" for="source">Source</label>
        <select id="source" name="source">
          <option value="">Any</option>
          {% for option in ['greenhouse', 'lever', 'ashby', 'indeed', 'linkedin_guest'] %}
          <option value="{{ option }}" {% if filters.source == option %}selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="chip-label" for="sort">Sort</label>
        <select id="sort" name="sort">
          <option value="posted" {% if filters.sort == 'posted' %}selected{% endif %}>Date posted</option>
          <option value="first_seen" {% if filters.sort == 'first_seen' %}selected{% endif %}>First seen</option>
        </select>
      </div>
      <div class="check">
        <input id="has_salary" name="has_salary" type="checkbox" value="1" {% if filters.has_salary %}checked{% endif %} />
        <label for="has_salary">Has salary</label>
      </div>
      <div class="check">
        <input id="include_closed" name="include_closed" type="checkbox" value="1" {% if filters.include_closed %}checked{% endif %} />
        <label for="include_closed">Include closed</label>
      </div>
    </div>
  </form>
  <div id="spinner" class="htmx-indicator" role="status">Loading jobs</div>
  <div class="panes">
    <section id="results" aria-live="polite">
      {% include "jobs.html" %}
    </section>
    <aside id="detail" aria-live="polite">
      {% if selected %}
        {% set job = selected %}
        {% include "detail.html" %}
      {% else %}
        <p class="detail-empty">Select a job to see the full description.</p>
      {% endif %}
    </aside>
  </div>
</main>
{% endblock %}

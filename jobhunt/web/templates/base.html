<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Job Hunt OS{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/htmx.min.js" defer></script>
  </head>
  <body>
    <header class="top">
      <a class="logo" href="/">Job Hunt</a>
      <nav>
        <a href="/">Board</a>
        <a href="/runs">Runs</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
    <script>
      document.body.addEventListener("jobUpdated", (event) => {
        const jobId = event.detail && event.detail.id;
        const detail = document.getElementById("detail");
        if (!jobId || !detail || typeof htmx === "undefined") {
          return;
        }
        htmx.ajax("GET", "/jobs/" + jobId, { target: detail, swap: "innerHTML" });
      });
    </script>
  </body>
</html>

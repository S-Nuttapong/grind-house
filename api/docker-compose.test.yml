name: jobhunt-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobhunt
      POSTGRES_PASSWORD: jobhunt
      POSTGRES_DB: jobhunt_test
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunt -d jobhunt_test"]
      interval: 2s
      timeout: 5s
      retries: 20
